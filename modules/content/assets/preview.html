<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SVG Motifs Preview</title>
<style>
body{font-family:system-ui;background:#f6f2e8;padding:32px;color:#17362a}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{background:#fffdfa;border:1px solid #d8d4c9;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px #0000000d}
.card img{width:100%;display:block}
.card div{padding:16px}.label{font-size:.75rem;font-weight:800;letter-spacing:.08em}
h3{margin:.35rem 0 0}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body>
<h1>Content Handler SVG Motifs</h1>
<div class="grid">
<div class="card"><img src="article-motif.svg" alt=""><div><span class="label">ARTICLE</span><h3>Article motif</h3></div></div>
<div class="card"><img src="story-motif.svg" alt=""><div><span class="label">STORY</span><h3>Story motif</h3></div></div>
<div class="card"><img src="link-motif.svg" alt=""><div><span class="label">LINK</span><h3>Link motif</h3></div></div>
</div></body></html>
