<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Handler</title>
    <meta
      name="description"
      content="Public-facing landing page for the Content Handler project."
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: #f8fafc;
      }

      main {
        width: min(42rem, calc(100% - 2rem));
        padding: 3rem 2rem;
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.72);
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.35);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 4vw, 3.5rem);
      }

      p {
        line-height: 1.6;
        font-size: 1.05rem;
      }

      a {
        color: #bfdbfe;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Content Handler</h1>
      <p>
        This repository hosts the public side of Content Handler and provides a
        simple GitHub Pages website for the project.
      </p>
      <p>
        Publish this repository with GitHub Pages to use this page as the
        project's public landing page.
      </p>
    </main>
  </body>
</html>
